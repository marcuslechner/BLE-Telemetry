name: ble_telemetry
description: Android battery telemetry display for the BD robot.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Newer releases require Android API 37, while Flutter 3.47 supports API 36.
  flutter_reactive_ble: 5.5.0
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 5.6.0 requires API 37, beyond Flutter 3.47's supported API 36 toolchain.
  reactive_ble_mobile: 5.5.0

flutter:
  uses-material-design: true
